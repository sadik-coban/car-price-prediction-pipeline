; EN: test settings. The fast gate (python tools/verify.py) runs everything except the marked slow layers.
; TR: test ayarları. Hızlı kapı (python tools/verify.py), işaretli yavaş katmanlar dışında her şeyi koşar.
[pytest]
testpaths = tests
addopts = -p no:cacheprovider
markers =
    data: reads the real data (data/raw, data/cars.duckdb); minutes; not in the fast gate | gerçek veriyi okur
    full: reruns the analysis chain (python analysis/run_all.py); ~16 min; manual | analiz zincirini yeniden koşar
    template: a scaffolded test not written yet; it fails on purpose until replaced | henüz yazılmamış iskelet testi; bilerek düşer
