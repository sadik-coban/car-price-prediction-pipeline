; EN: test settings. The fast gate (python tools/verify.py) runs everything except the marked slow layers.
; TR: test ayarları. Hızlı kapı (python tools/verify.py), işaretli yavaş katmanlar dışında her şeyi koşar.
[pytest]
testpaths = tests
pythonpath = notebooks
addopts = -p no:cacheprovider
markers =
    data: reads the real data (data/raw, data/cars.duckdb) or runs a notebook; minutes; not in the fast gate | gerçek veriyi okur ya da defter koşar
